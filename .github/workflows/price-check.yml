name: Daily Xpulse price check

# Runs the scraper once a day and commits the updated price history.
# The Android app reads data/price_history.json straight from this repo.

on:
  schedule:
    # 03:30 UTC = 09:00 IST, every day. GitHub cron can be delayed a few
    # minutes under load; that is fine for a once-a-day bike price.
    - cron: "30 3 * * *"
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

permissions:
  contents: write          # needed to push the updated JSON back to the repo

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape price
        run: python scraper/scrape.py

      - name: Commit updated price history
        run: |
          git config user.name  "xpulse-price-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/price_history.json; then
            echo "No price change today."
          else
            git add data/price_history.json
            git commit -m "price: update $(date -u +%Y-%m-%d)"
            git push
          fi
